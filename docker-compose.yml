services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - "./.env"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: nextjs
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  database:
    container_name: postgres_db
    image: "postgis/postgis:16-3.5"
    ports:
      - "7000:5432"
    env_file:
      - "./.env"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d bookmyvenue" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
